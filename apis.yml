name: Fortastra
description: Fortastra is a spacecraft manufacturer building low-cost, maneuverable
  orbital defense systems designed for scalability and autonomous operation. Its spacecraft
  protect space-based infrastructure with autonomous navigation that detects, analyzes,
  and responds to orbital anomalies without relying on distant ground-based sensors.
  The company's open software architecture spans sensing, maneuvering, coordination,
  and response functions, and its hardware is validated through component testing,
  simulation, and orbital deployment. Surfaced as a portfolio company of bloomberg-beta.
